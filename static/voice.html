
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adam - Truck Dispatch Agent</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 50px auto;
      padding: 20px;
      background: #101827;
      color: white;
    }
    h1 { margin-bottom: 8px; }
    p { color: #b8c4d8; }
    button {
      border: 0;
      cursor: pointer;
      font-size: 15px;
    }
    #voiceToggle {
      width: 76px;
      height: 76px;
      margin: 10px 0;
      padding: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1e293b;
      color: white;
      transition: background 0.2s ease;
    }
    .toggle-row {
      text-align: center;
    }
    .toggle-row p {
      color: #b8c4d8;
    }
    #voiceToggle:hover { background: #2f3b52; }
    #voiceToggle svg { width: 34px; height: 34px; }
    #voiceToggle .icon-speaker { display: none; }
    #voiceToggle.listening {
      background: #22c55e;
      color: #06210e;
      animation: micPulse 1.6s ease-out infinite;
    }
    #voiceToggle.speaking {
      background: #38bdf8;
      color: #06283d;
    }
    #voiceToggle.speaking .icon-mic { display: none; }
    #voiceToggle.speaking .icon-speaker { display: block; }
    @keyframes micPulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
      70% { box-shadow: 0 0 0 18px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    #status {
      margin: 20px 0;
      color: #86efac;
    }
    #conversation {
      padding: 16px;
      background: #1e293b;
      border-radius: 10px;
      min-height: 160px;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h1>Adam — Truck Dispatch Agent</h1>
  <p>Speak naturally. Adam will respond automatically.</p>

  <div class="toggle-row">
    <button id="voiceToggle" type="button" aria-label="Start listening">
      <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <path d="M12 18v3"></path>
      </svg>
      <svg class="icon-speaker" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 10v4h4l5 4V6L7 10H3Z" fill="currentColor" stroke="none"></path>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
        <path d="M18.5 6a9 9 0 0 1 0 12"></path>
      </svg>
    </button>
    <p>Tap the mic to start. Tap again to stop. The icon changes to a speaker while Adam talks.</p>
  </div>

  <div id="status">Ready</div>
  <div id="conversation">Your conversation will appear here.</div>

  
<script>
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  const statusEl = document.getElementById("status");
  const conversationEl = document.getElementById("conversation");
  const voiceToggle = document.getElementById("voiceToggle");

  function setToggleState(state) {
    voiceToggle.classList.remove("listening", "speaking");

    if (state === "listening") {
      voiceToggle.classList.add("listening");
      voiceToggle.setAttribute("aria-label", "Stop listening");
    } else if (state === "speaking") {
      voiceToggle.classList.add("speaking");
      voiceToggle.setAttribute("aria-label", "Stop the assistant");
    } else {
      voiceToggle.setAttribute("aria-label", "Start listening");
    }
  }

  if (!SpeechRecognition) {
    statusEl.textContent =
      "Speech recognition is unavailable. Try updated Google Chrome.";
    voiceToggle.disabled = true;
    throw new Error("SpeechRecognition is not supported.");
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;

  let listeningEnabled = false;
  let carrierSelectionAttempted = false;
  let busy = false;
  let assistantSpeaking = false;
  let currentAudio = null;
  let currentAbortController = null;
  let requestNumber = 0;
  let restartTimer = null;

  let conversationId = sessionStorage.getItem("adam_conversation_id");

  if (!conversationId) {
    conversationId = crypto.randomUUID();
    sessionStorage.setItem("adam_conversation_id", conversationId);
  }

  let micStream = null;
  let audioContext = null;
  let analyser = null;
  let micData = null;
  let micMonitor = null;
  let speechStartedAt = 0;
  let lastLoudAt = 0;
  let interruptionTriggered = false;

  const INTERRUPTION_THRESHOLD = 0.02;
  const INTERRUPTION_HOLD_MS = 150;

  function setStatus(message) {
    statusEl.textContent = message;
  }

  function appendMessage(speaker, text) {
    if (
      conversationEl.textContent ===
      "Your conversation will appear here."
    ) {
      conversationEl.textContent = "";
    }

    conversationEl.textContent += `${speaker}: ${text}\n\n`;
    conversationEl.scrollTop = conversationEl.scrollHeight;
  }

  
async function startMicMonitor() {
  if (micMonitor) return true;

  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    audioContext = new AudioContext();
    await audioContext.resume();

    const source = audioContext.createMediaStreamSource(micStream);
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 512;

    source.connect(analyser);
    micData = new Uint8Array(analyser.fftSize);

    micMonitor = setInterval(() => {
      if (!listeningEnabled || !assistantSpeaking || !analyser) {
        speechStartedAt = 0;
        lastLoudAt = 0;
        return;
      }

      analyser.getByteTimeDomainData(micData);

      let sum = 0;

      for (const sample of micData) {
        const normalized = (sample - 128) / 128;
        sum += normalized * normalized;
      }

      const rms = Math.sqrt(sum / micData.length);
      const now = Date.now();

      if (rms > INTERRUPTION_THRESHOLD) {
        if (!speechStartedAt) speechStartedAt = now;
        lastLoudAt = now;

        
        if (
          now - speechStartedAt >= INTERRUPTION_HOLD_MS &&
          !interruptionTriggered
        ) {
          interruptionTriggered = true;

          requestNumber++;

          if (currentAbortController) {
            currentAbortController.abort();
            currentAbortController = null;
          }

          if (currentAudio) {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio = null;
          }

          assistantSpeaking = false;
          busy = false;

          setStatus("Interruption detected. Keep speaking...");
        }

      } else if (now - lastLoudAt > 350) {
        speechStartedAt = 0;
      }
    }, 50);

    return true;
  } catch (error) {
    console.error("Microphone monitor error:", error);
    listeningEnabled = false;
    setToggleState("idle");
    setStatus("Could not access microphone. Check Chrome permissions.");
    return false;
  }
}


  function startRecognition() {
    if (!listeningEnabled) return;

    try {
      recognition.start();
    } catch (error) {
    }
  }

  
  voiceToggle.onclick = () => {
    if (listeningEnabled || busy || assistantSpeaking) {
      stopConversation();
    } else {
      startListening();
    }
  };

  async function startListening() {
    listeningEnabled = true;
    setToggleState("listening");

    const micReady = await startMicMonitor();

    if (!micReady) {
      return;
    }

    setStatus("Listening... speak now.");
    startRecognition();
  }

  function stopConversation() {
    listeningEnabled = false;
    busy = false;
    assistantSpeaking = false;
    interruptionTriggered = false;
    requestNumber++;

    clearTimeout(restartTimer);

    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
    }

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }

    try {
      recognition.stop();
    } catch (error) {
    }

    setToggleState("idle");
    setStatus("Conversation stopped.");
  }

  
  recognition.onresult = (event) => {
    let interim = "";
    let finalText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;

      if (event.results[i].isFinal) {
        finalText += text;
      } else {
        interim += text;
      }
    }

    if (interim.trim()) {
      if (assistantSpeaking || interruptionTriggered) {
        setStatus("Listening for interruption: " + interim);
      } else if (!busy) {
        setStatus("Hearing: " + interim);
      }
    }

    const message = finalText.trim();
    if (!message) return;

    if (interruptionTriggered || assistantSpeaking) {
      interruptionTriggered = false;
      interruptAdam(message);
      return;
    }

    if (!busy) {
      interruptionTriggered = false;
      askAdam(message);
    }
  };


  recognition.onerror = (event) => {
    if (event.error === "not-allowed") {
      listeningEnabled = false;
      setToggleState("idle");
      setStatus("Allow microphone access in Chrome, then try again.");
    } else if (
      event.error !== "no-speech" &&
      event.error !== "aborted"
    ) {
      setStatus("Speech recognition: " + event.error);
    }
  };

  recognition.onend = () => {
    clearTimeout(restartTimer);

    if (listeningEnabled) {
      restartTimer = setTimeout(startRecognition, 250);
    }
  };

  function interruptAdam(message) {
    requestNumber++;

    if (currentAbortController) {
      currentAbortController.abort();
      currentAbortController = null;
    }

    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio = null;
    }

    assistantSpeaking = false;
    busy = false;

    setToggleState("listening");
    setStatus("You interrupted Adam. Preparing response...");
    askAdam(message);
  }


async function askAdam(message) {
    busy = true;

    const thisRequest = ++requestNumber;
    const controller = new AbortController();
    currentAbortController = controller;

    appendMessage("You", message);
    setStatus("Adam is thinking...");

    try {
        if (!carrierSelectionAttempted) {
            carrierSelectionAttempted = true;

            try {
                const selectionResponse = await fetch(
                    `/next-carrier?conversation_id=${encodeURIComponent(conversationId)}`
                );

                if (selectionResponse.ok) {
                    const selection = await selectionResponse.json();
                    console.log("Carrier selection:", selection);
                } else {
                    console.warn(
                        "Carrier selection failed:",
                        selectionResponse.status
                    );
                }
            } catch (selectionError) {
                console.warn(
                    "Carrier selection unavailable:",
                    selectionError
                );
            }
        }

        const response = await fetch("/stream-voice", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: message,
                conversation_id: conversationId
            }),
            signal: controller.signal
        });

        if (!response.ok) {
            throw new Error(
                "Server returned HTTP " + response.status
            );
        }

        if (!response.body) {
            throw new Error(
                "Streaming is not supported by this response."
            );
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        let pending = "";
        let audioQueue = Promise.resolve();

        async function playAudio(base64Audio) {
            if (thisRequest !== requestNumber) return;

            const binary = atob(base64Audio);
            const bytes = new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }

            const blob = new Blob(
                [bytes],
                { type: "audio/mpeg" }
            );

            const url = URL.createObjectURL(blob);
            const audio = new Audio(url);

            currentAudio = audio;
            assistantSpeaking = true;

            setToggleState("speaking");
            setStatus("Adam is speaking...");

            try {
                await new Promise((resolve, reject) => {
                    audio.onended = resolve;
                    audio.onpause = resolve;

                    audio.onerror = () => {
                        reject(
                            new Error("Could not play Adam's audio.")
                        );
                    };

                    audio.play().catch(reject);
                });
            } finally {
                URL.revokeObjectURL(url);

                if (currentAudio === audio) {
                    currentAudio = null;
                }
            }
        }

        while (true) {
            const { value, done } = await reader.read();

            if (thisRequest !== requestNumber) {
                await reader.cancel().catch(() => {});
                break;
            }

            if (done) break;

            pending += decoder.decode(value, { stream: true });

            const events = pending.split("\n\n");
            pending = events.pop() || "";

            for (const rawEvent of events) {
                const line = rawEvent
                    .split("\n")
                    .find(line => line.startsWith("data: "));

                if (!line) continue;

                const data = JSON.parse(line.slice(6));

                if (data.type === "audio") {
                    if (data.text) {
                        appendMessage("Adam", data.text);
                    }

                    audioQueue = audioQueue.then(
                        () => playAudio(data.audio)
                    );
                } else if (data.type === "error") {
                    throw new Error(data.message);
                }
            }
        }

        await audioQueue;

        if (thisRequest === requestNumber) {
            assistantSpeaking = false;
            busy = false;
            currentAbortController = null;

            setStatus(
                "Listening... you can speak whenever you're ready."
            );

            setToggleState(listeningEnabled ? "listening" : "idle");
        }

    } catch (error) {
        if (thisRequest === requestNumber) {
            assistantSpeaking = false;
            busy = false;
            currentAbortController = null;

            if (error.name === "AbortError") {
                setStatus("Response cancelled.");
            } else {
                setStatus("Error: " + error.message);
                console.error(error);
            }

            setToggleState(listeningEnabled ? "listening" : "idle");
        }
    }
}
  
</script>

</body>
</html>
